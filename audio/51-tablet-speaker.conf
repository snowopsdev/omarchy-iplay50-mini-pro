# Discovery candidate: root must validate/install and activate HiFi explicitly.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-soc_sound" } ]
    actions = {
      update-props = {
        api.alsa.use-ucm = true
        api.acp.disable-pro-audio = true
        api.acp.probe-rate = 48000
      }
    }
  }
  {
    matches = [ { node.name = "alsa_output.platform-soc_sound.HiFi__Speaker__sink" } ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
