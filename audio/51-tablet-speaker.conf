# Discovery candidate: root must validate/install and activate HiFi explicitly.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-soc_sound" } ]
    actions = {
      update-props = {
        api.alsa.use-ucm = true
        api.acp.disable-pro-audio = true
        api.acp.probe-rate = 48000
      }
    }
  }
  {
    matches = [ { node.name = "alsa_output.platform-soc_sound.HiFi__Speaker__sink" } ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
  # The capture DMA delivers 16-bit samples even when S32_LE is negotiated, so
  # S32 doubles the pitch (two real frames per frame). Force S16LE as above.
  {
    matches = [ { node.name = "alsa_input.platform-soc_sound.HiFi__Mic__source" } ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
