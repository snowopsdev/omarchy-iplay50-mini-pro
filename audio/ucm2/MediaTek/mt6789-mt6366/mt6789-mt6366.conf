Syntax 4
LibraryConfig.tablet.SubstiConfig {
    pcm.tablet_speaker {
        type hw
        card "${CardId}"
        device 0
        drain_silence 0
    }
}
# Speaker + internal mic. Headphones/headset are omitted until their jack
# paths pass independently; no generic DSP profiles.
SectionUseCase."HiFi" {
    File "/MediaTek/mt6789-mt6366/HiFi.conf"
    Comment "Tablet speakers and microphone"
}
BootSequence [
    cset "name='Ext_Speaker_Amp Switch' off"
    cset "name='LOL Mux' Open"
    cset "name='HPL Mux' Open"
    cset "name='HPR Mux' Open"
    cset "name='RCV Mux' Open"
]
