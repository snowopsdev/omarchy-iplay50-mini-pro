# Vendor vext options select int_hp_buf / SPK_PATH_HP=yes (one speaker).
# Paths: PLAYBACK1_TO_ADDA_DL + headphoneSpeaker_output + ext_speaker_output.
# Fixed conservative analog gain; PipeWire controls software volume.
# The mic route is set in the verb too: ACP probes Capture_1 (hw:N,9) and its
# hw_params fail with EINVAL while the UL1 route is off. Routes only connect
# DAPM paths; nothing powers up until the PCM is opened.
SectionVerb {
    EnableSequence [
        cset "name='ADDA_DL_CH1 DL1_CH1' on"
        cset "name='ADDA_DL_CH2 DL1_CH2' on"
        cset "name='ADDA_UL_Mux' MTKAIF"
        cset "name='Mic Type Mux' ACC"
        cset "name='PGA1 Volume' 4"
        cset "name='PGA2 Volume' 4"
        cset "name='PGA L Mux' AIN0"
        cset "name='PGA R Mux' AIN0"
        cset "name='ADC L Mux' Left Preamplifier"
        cset "name='ADC R Mux' Right Preamplifier"
        cset "name='UL1_CH1 ADDA_UL_CH1' on"
        cset "name='UL1_CH2 ADDA_UL_CH2' on"
    ]
    DisableSequence [
        cset "name='ADDA_DL_CH1 DL1_CH1' off"
        cset "name='ADDA_DL_CH2 DL1_CH2' off"
        cset "name='UL1_CH1 ADDA_UL_CH1' off"
        cset "name='UL1_CH2 ADDA_UL_CH2' off"
    ]
    Value { TQ "HiFi" }
}
SectionDevice."Speaker" {
    Comment "Tablet speakers"
    EnableSequence [
        cset "name='Headset Volume' 10,10"
        cset "name='DAC In Mux' Normal Path"
        cset "name='LOL Mux' Open"
        cset "name='HPL Mux' LoudSPK Playback"
        cset "name='HPR Mux' LoudSPK Playback"
        cset "name='Ext_Speaker_Amp Switch' on"
    ]
    DisableSequence [
        cset "name='Ext_Speaker_Amp Switch' off"
        cset "name='HPL Mux' Open"
        cset "name='HPR Mux' Open"
        cset "name='LOL Mux' Open"
    ]
    Value {
        PlaybackPriority 200
        PlaybackPCM "tablet_speaker"
        PlaybackChannels 2
        PlaybackRate 48000
    }
}

# Built-in analog MEMS mic on AIN0 (vendor builtin_Mic_Mic1), both channels.
# AIN2 (vendor "mic2") carries no signal on this unit. PGA 4 = max analog gain
# (24 dB); the level is still modest, so raise the source volume in PipeWire.
SectionDevice."Mic" {
    Comment "Internal microphone"
    Value {
        CapturePriority 100
        CapturePCM "hw:${CardId},9"
        CaptureChannels 2
        CaptureRate 48000
    }
}
