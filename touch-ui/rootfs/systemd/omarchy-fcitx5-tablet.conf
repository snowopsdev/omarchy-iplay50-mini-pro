# Tablet: wvkbd --auto must own the Wayland input-method slot so a focused text
# field raises the touch keyboard. fcitx5 keeps its DBus/XIM frontends; only its
# Wayland input-method frontend (CapsLock compose for Wayland apps) is dropped,
# which the touch keyboard cannot use anyway.
[Service]
ExecStart=
ExecStart=/usr/bin/fcitx5 --disable notificationitem,waylandim
